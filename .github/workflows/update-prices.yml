name: Update Prices

# RETIRED 2026-06-08: The Fuckupometer was frozen at Day 94. The hourly price
# refresh is disabled because the upstream feeds (Yahoo/Stooq) became unreliable
# from CI egress and the site no longer displays live data. The job body is kept
# (and manual-only via workflow_dispatch) so it can be revived if ever needed,
# but it no longer runs on a schedule.

on:
  workflow_dispatch: # manual trigger only — scheduled runs disabled on retirement

concurrency:
  group: update-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch prices
        run: node scripts/fetch-prices.js

      - name: Commit if changed
        run: |
          git config user.name  "fuckupometer-bot"
          git config user.email "bot@thelongmemo.com"
          git add public/data/prices.json
          if git diff --cached --quiet; then
            echo "No price changes; nothing to commit."
          else
            git commit -m "Hourly price refresh [skip ci]"
            git push
          fi
